<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recepción · GP Dermatología</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --crema:#f4efe7; --crema2:#fbf8f2; --verde:#1f3d34; --verde2:#2c5446;
         --tinta:#26201a; --suave:#8a8076; --linea:#e3dccf; --mal:#b23b3b; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--crema);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column}

  .top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--crema2);
       border-bottom:1px solid var(--linea);flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:10px}
  .marca img{height:44px;width:auto;max-width:120px;object-fit:contain;display:block}
  .marca .t{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:18px;color:#1B2422;line-height:1.1}
  .marca .s{font-size:11.5px;color:var(--suave)}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .tabs button{position:relative;font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 16px;
    border-radius:10px;border:1px solid var(--linea);background:#fff;color:var(--verde);cursor:pointer}
  .tabs button.on{background:var(--verde);color:#fff;border-color:var(--verde)}
  .tabs button .n{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;border-radius:999px;
    background:var(--mal);color:#fff;font-size:11px;font-weight:700;display:none;
    align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--crema2)}
  .tabs button .n.show{display:inline-flex}

  .marco{flex:1;position:relative;background:var(--crema)}
  .marco iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--crema)}
  .marco iframe.on{display:block}
</style>
</head>
<body>
  <div class="top">
    <div class="marca">
      <img src="/Logo-gp-Vertic.png" alt="" onerror="this.style.display='none'">
      <div><div class="t">Recepción</div><div class="s">Panel de Clarita · GP Dermatología</div></div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="marco" id="marco"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// Panel maestro de Clarita: una sola página con pestañas rotuladas.
// Cada pestaña carga el panel existente (intacto) dentro de un marco; los
// paneles siguen funcionando igual si se abren solos. La pestaña "Cola en
// vivo" muestra un contador de pendientes en tiempo real.
// Para agregar una pestaña futura (ej. No-show): añadir una línea a TABS.
// ─────────────────────────────────────────────────────────────────────────────
const TABS = [
  { id:'cola',     titulo:'Cola en vivo',   url:'gp-cola.html',         badge:true  },
  { id:'preparar', titulo:'Preparar día',   url:'gp-preparar-dia.html', badge:false },
  { id:'packs',    titulo:'Packs · Abonos', url:'gp-packs.html',        badge:false },
  { id:'caja',     titulo:'Caja',           url:'gp-caja.html',         badge:false },
  { id:'reservas', titulo:'No-show',        url:'gp-reservas.html',     badge:false },
  { id:'manual',   titulo:'Manual',         url:'manual-clarita.html',  badge:false }
];

const SUPABASE_URL = 'https://nirxkzkfcctdigvuapuc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pcnhremtmY2N0ZGlndnVhcHVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDY5MTUsImV4cCI6MjA5NTEyMjkxNX0.iGTkHTRgdsEDoUsvS9ApQtSRAJV52z-_IASlFBmPqDM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $tabs = document.getElementById('tabs');
const $marco = document.getElementById('marco');
const frames = {};

TABS.forEach(t => {
  const b = document.createElement('button');
  b.id = 'tab-' + t.id;
  b.innerHTML = t.titulo + (t.badge ? '<span class="n" id="badge-' + t.id + '">0</span>' : '');
  b.onclick = () => abrir(t.id);
  $tabs.appendChild(b);
});

function abrir(id){
  const t = TABS.find(x => x.id === id) || TABS[0];
  TABS.forEach(x => document.getElementById('tab-' + x.id).classList.toggle('on', x.id === t.id));
  if(!frames[t.id]){
    const f = document.createElement('iframe');
    f.src = t.url;
    frames[t.id] = f;
    $marco.appendChild(f);
  }
  Object.keys(frames).forEach(k => frames[k].classList.toggle('on', k === t.id));
  try{ history.replaceState(null, '', '#' + t.id); }catch(e){}
}

// Contador de pendientes de la cola, en vivo desde cualquier pestaña
async function contarPendientes(){
  try{
    const { count } = await sb.from('clarita_acciones')
      .select('id', { count:'exact', head:true })
      .eq('estado','pendiente').not('tipo','like','ajuste_%');
    const el = document.getElementById('badge-cola');
    if(!el) return;
    el.textContent = count || 0;
    el.classList.toggle('show', (count || 0) > 0);
  }catch(e){ /* sin contador, sin drama */ }
}
sb.channel('clarita-shell')
  .on('postgres_changes', { event:'*', schema:'public', table:'clarita_acciones' }, contarPendientes)
  .subscribe();
contarPendientes();
setInterval(contarPendientes, 60000);   // respaldo por si el realtime se cae

// Pestaña inicial: la del #hash de la URL, o la cola
abrir((location.hash || '#cola').slice(1));
</script>
</body>
</html>
