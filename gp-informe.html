<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe · GP Dermatología</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --crema:#f4efe7; --crema2:#fbf8f2; --verde:#1f3d34; --tinta:#26201a;
         --suave:#8a8076; --linea:#e3dccf; --ok:#2f7d5b; --mal:#b23b3b;
         --aviso:#8a6d2f; --pack:#7a5c8a; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--crema);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;
    line-height:1.5;padding:22px 16px 70px;display:flex;justify-content:center}
  .wrap{max-width:980px;width:100%}
  .head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
    padding:6px 0 14px;border-bottom:1px solid #E3E6E3;margin-bottom:18px}
  .head .t{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:20px;color:#1B2422}
  .head .s{font-size:12.5px;color:#7a8079}
  .head img{height:74px;width:auto;display:block;justify-self:center;max-width:150px;object-fit:contain}

  .barra{background:var(--crema2);border:1px solid var(--linea);border-radius:16px;
    padding:14px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .campo{display:flex;flex-direction:column;gap:4px}
  .campo label{font-size:11.5px;color:var(--suave);font-weight:500}
  .campo input,.campo select{font-size:15px;padding:9px 12px;border:1px solid var(--linea);
    border-radius:10px;background:#fff;color:var(--tinta);font-family:inherit}
  button.btn{font-family:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:11px 18px;
    border:1px solid var(--verde);background:var(--verde);color:#fff;cursor:pointer}
  button.btn.sec{background:#fff;color:var(--verde)}
  button.btn:disabled{opacity:.5;cursor:progress}

  h2{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:19px;color:#1B2422;margin:26px 0 10px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
  .kpi{background:var(--crema2);border:1px solid var(--linea);border-radius:13px;padding:12px 14px}
  .kpi .kl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);font-weight:600}
  .kpi .kv{font-family:ui-monospace,monospace;font-size:19px;font-weight:700;color:#23291F;margin-top:2px}
  .kpi .kd{font-size:11.5px;margin-top:2px;font-weight:600}
  .kpi.pack .kv{color:var(--pack)}
  .kd.up{color:var(--ok)} .kd.down{color:var(--mal)} .kd.flat{color:var(--suave)}

  table{width:100%;border-collapse:collapse;background:var(--crema2);border:1px solid var(--linea);
    border-radius:13px;overflow:hidden;font-size:13.5px}
  th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);
    text-align:left;padding:9px 12px;background:#f6f1e8;border-bottom:1px solid var(--linea)}
  td{padding:8px 12px;border-bottom:1px solid #efe9dc;vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.m,th.m{text-align:right;font-family:ui-monospace,monospace;white-space:nowrap}
  tr.tot td{background:#f6f1e8;font-weight:700}
  .chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;background:#eee9de;color:#8a8076}
  .chip.pack{background:#efe8f3;color:var(--pack)}
  .chip.ok{background:#e8f0ec;color:var(--ok)}
  .chip.mal{background:#f6e3e3;color:var(--mal)}

  .alerta{border-radius:12px;padding:11px 14px;font-size:13px;margin:10px 0}
  .alerta.ok{background:#E7EEE5;border:1px solid #BCD4C7;color:#3F6249}
  .alerta.warn{background:#fdf6e6;border:1px solid #e6d3a3;color:var(--aviso)}
  .alerta.bad{background:#f6e3e3;border:1px solid #dcb5b5;color:var(--mal)}
  .vacio{text-align:center;color:var(--suave);font-size:14px;padding:44px 0;font-style:italic}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){ .dos{grid-template-columns:1fr} }
  .pie{font-size:11.5px;color:var(--suave);margin-top:22px;text-align:center}

  /* embudo de conversión */
  .funnel{display:grid;gap:8px;margin:10px 0}
  .frow{display:grid;grid-template-columns:170px 1fr 190px;gap:10px;align-items:center}
  .frow .fl{font-size:13px;font-weight:600}
  .frow .fbar{height:22px;border-radius:7px;background:#1f3d34;min-width:3px}
  .frow.c2 .fbar{background:#2c5446} .frow.c3 .fbar{background:#9A6B2F}
  .frow.c4 .fbar{background:#7a4a1f} .frow.c5 .fbar{background:#7a5c8a} .frow.c6 .fbar{background:#b9b0a2}
  .frow .fm{font-size:12px;color:var(--suave);text-align:right;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div style="line-height:1.2;justify-self:start">
      <div class="t">Informe del período</div>
      <div class="s">SkinTouch · LaserTouch — desde los cobros reales del sistema</div>
    </div>
    <img src="/Logo-gp-Vertic.png" alt="" onerror="this.style.display='none'">
    <div></div>
  </div>

  <div class="barra">
    <div class="campo"><label>Período</label>
      <select id="tipo" onchange="cambiaTipo()">
        <option value="mes">Mes</option>
        <option value="trimestre">Trimestre</option>
        <option value="semestre">Semestre</option>
        <option value="anio">Año</option>
      </select></div>
    <div class="campo" id="c-mes"><label>Mes</label><input type="month" id="mes"></div>
    <div class="campo" id="c-anio" style="display:none"><label>Año</label>
      <input type="number" id="anio" min="2025" max="2040" style="width:100px"></div>
    <div class="campo" id="c-sub" style="display:none"><label id="l-sub">Trimestre</label>
      <select id="sub"></select></div>
    <button class="btn" id="btn" onclick="cargar()">Generar informe</button>
    <button class="btn sec" id="btn-xls" onclick="descargarExcel()" disabled>Descargar Excel</button>
  </div>

  <div id="cont"><div class="vacio">Elige un período y pulsa “Generar informe”.</div></div>
  <div class="pie">GP Dermatología · generado desde el sistema de caja — sin transcripción manual de vouchers.
    Los meses anteriores a la puesta en marcha de la caja quedan incompletos.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// Informe de negocio por período (mes · trimestre · semestre · año).
// Fuente única: `cobros` (pagados, sin pruebas), cruzada con `boletas` por
// cobro_id, `prestaciones.categoria` (embudo consultas→procedimientos→cirugías)
// y `packs` (deuda vigente).
// Reglas: plata nueva = todos los medios reales (venta de pack incluida);
// Efectivo Pack = consumo prepagado, aparte, jamás sumado a ingresos.
// Cuadratura Bsale: boleteado − consumos de pack + anticipos ± sin boleta
// = plata nueva. La diferencia entre Bsale y la caja SON los packs.
// ─────────────────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://nirxkzkfcctdigvuapuc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pcnhremtmY2N0ZGlndnVhcHVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDY5MTUsImV4cCI6MjA5NTEyMjkxNX0.iGTkHTRgdsEDoUsvS9ApQtSRAJV52z-_IASlFBmPqDM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const clp = n => '$' + Math.round(n||0).toLocaleString('es-CL');
const sum = (arr,f) => arr.reduce((s,x)=>s+(f(x)||0),0);
const EMP = { 1:'SkinTouch', 2:'LaserTouch' };
const diaScl = iso => new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/Santiago'});
// Las categorías se leen tal cual están en el catálogo (Cirugía, Láser,
// Inyectables, …): si mañana crean una categoría nueva en gp-catalogo.html,
// el informe la muestra solo, sin tocar código.
const SIN_CAT = 'Sin categoría';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function agruparPorCategoria(boletas, PRES){
  const porCat = {};
  boletas.forEach(b => {
    const k = catDe(b, PRES);
    if(!porCat[k]) porCat[k] = { n:0, monto:0 };
    porCat[k].n++; porCat[k].monto += (b.total||0);
  });
  const cats = Object.keys(porCat).sort((a,b)=>{
    if(a===SIN_CAT) return 1; if(b===SIN_CAT) return -1;
    return porCat[b].monto - porCat[a].monto;
  });
  return { porCat, cats };
}

// ── Selector de período ──
(function(){
  const hoy = new Date().toLocaleDateString('en-CA',{timeZone:'America/Santiago'});
  $('mes').value = hoy.slice(0,7);
  $('anio').value = hoy.slice(0,4);
})();
function cambiaTipo(){
  const t = $('tipo').value;
  $('c-mes').style.display = t==='mes' ? '' : 'none';
  $('c-anio').style.display = t==='mes' ? 'none' : '';
  $('c-sub').style.display = (t==='trimestre'||t==='semestre') ? '' : 'none';
  if(t==='trimestre'){ $('l-sub').textContent='Trimestre';
    $('sub').innerHTML='<option value="1">T1 (ene–mar)</option><option value="2">T2 (abr–jun)</option><option value="3">T3 (jul–sep)</option><option value="4">T4 (oct–dic)</option>'; }
  if(t==='semestre'){ $('l-sub').textContent='Semestre';
    $('sub').innerHTML='<option value="1">1er semestre</option><option value="2">2º semestre</option>'; }
}

// Devuelve { desde:'YYYY-MM', n: meses, etiqueta }
function rango(){
  const t = $('tipo').value;
  if(t==='mes')       return { desde: $('mes').value, n: 1,  etiqueta: $('mes').value };
  const y = $('anio').value;
  const s = parseInt($('sub').value||'1',10);
  if(t==='trimestre') return { desde: y+'-'+String((s-1)*3+1).padStart(2,'0'), n: 3,  etiqueta: 'T'+s+' '+y };
  if(t==='semestre')  return { desde: y+'-'+(s===1?'01':'07'),                 n: 6,  etiqueta: (s===1?'1er':'2º')+' semestre '+y };
  return { desde: y+'-01', n: 12, etiqueta: 'Año '+y };
}
function mesesDe(desde, n){
  const out = []; const d = new Date(desde + '-01T12:00:00Z');
  for(let i=0;i<n;i++){ out.push(d.toISOString().slice(0,7)); d.setMonth(d.getMonth()+1); }
  return out;
}
function restaMeses(desde, n){
  const d = new Date(desde + '-01T12:00:00Z'); d.setMonth(d.getMonth()-n);
  return d.toISOString().slice(0,7);
}

// Cobros pagados reales del rango de meses, al día de Santiago
async function cobrosDeRango(desde, n){
  const meses = new Set(mesesDe(desde, n));
  const d0 = new Date(desde + '-01T12:00:00Z'); d0.setDate(d0.getDate()-2);
  const d1 = new Date(desde + '-01T12:00:00Z'); d1.setMonth(d1.getMonth()+n); d1.setDate(d1.getDate()+2);
  const { data, error } = await sb.from('cobros').select('*')
    .eq('estado','pagado').eq('es_prueba', false)
    .gte('fecha', d0.toISOString()).lt('fecha', d1.toISOString());
  if(error) throw new Error('cobros → ' + error.message);
  return (data||[]).filter(c => meses.has(diaScl(c.fecha).slice(0,7)));
}

let DATA = null;

async function cargar(){
  const R = rango();
  if(!R.desde) return;
  const btn = $('btn'); btn.disabled = true; btn.textContent = 'Generando…';
  $('btn-xls').disabled = true;
  $('cont').innerHTML = '<div class="vacio">Leyendo los cobros del período…</div>';
  try{
    const prevDesde = restaMeses(R.desde, R.n);
    const [cob, cobPrev] = await Promise.all([
      cobrosDeRango(R.desde, R.n), cobrosDeRango(prevDesde, R.n)
    ]);

    // Boletas por cobro_id (en lotes, sin depender de fechas)
    let boletas = [];
    const ids = cob.map(c=>c.id);
    for(let i=0; i<ids.length; i+=100){
      const { data } = await sb.from('boletas').select('*').in('cobro_id', ids.slice(i,i+100));
      boletas = boletas.concat(data||[]);
    }

    // Catálogo con categorías (para el embudo)
    let PRES = {};
    let sinCategoria = false;
    try{
      let rPr = await sb.from('prestaciones').select('id,nombre,codigo,categoria,cirugia_tipo');
      if(rPr.error && /cirugia_tipo/.test(rPr.error.message||''))
        rPr = await sb.from('prestaciones').select('id,nombre,codigo,categoria');  // sin catalogo-tipo.sql aún
      if(rPr.error) throw rPr.error;
      (rPr.data||[]).forEach(p => PRES[p.id] = p);
    }catch(e){ sinCategoria = true; }   // columna aún no creada → sección con aviso

    // Deuda vigente a pacientes (foto de HOY)
    const { data: dp } = await sb.from('packs').select('saldo,nombre_pack,paciente_rut,tipo')
      .eq('estado','activo').eq('es_prueba', false);

    // Nombres para el Excel
    const ruts = [...new Set(cob.map(c=>c.paciente_rut).filter(Boolean))];
    const NOM = {};
    for(let i=0; i<ruts.length; i+=100){
      const { data } = await sb.from('pacientes').select('rut,nombre,apellido').in('rut', ruts.slice(i,i+100));
      (data||[]).forEach(p => NOM[p.rut] = ((p.nombre||'')+' '+(p.apellido||'')).trim());
    }

    DATA = { R, cob, cobPrev, boletas, PRES, sinCategoria,
             deudaHoy: sum(dp||[],p=>p.saldo), packsActivos: dp||[], NOM };
    render(DATA);
    $('btn-xls').disabled = false;
  }catch(e){
    $('cont').innerHTML = '<div class="vacio">No se pudo generar: ' + (e.message||e) + '</div>';
  }finally{
    btn.disabled = false; btn.textContent = 'Generar informe';
  }
}

function normMedio(m){
  const s = (m||'').toLowerCase();
  if(s.indexOf('pack')>=0) return 'pack';
  if(s.indexOf('transf')>=0) return 'transferencia';
  if(s.indexOf('web')>=0) return 'webpay';
  if(s.indexOf('pos')>=0 || s.indexOf('tarj')>=0 || s.indexOf('déb')>=0 || s.indexOf('deb')>=0 || s.indexOf('créd')>=0 || s.indexOf('cred')>=0) return 'pos';
  if(s.indexOf('efect')>=0) return 'efectivo';
  return 'otro';
}
const MEDIOS = [
  {key:'transferencia', label:'Transferencia'}, {key:'webpay', label:'WebPay'},
  {key:'pos', label:'POS'}, {key:'efectivo', label:'Efectivo'}, {key:'otro', label:'Otro'}
];
function partes(cobros){
  return { fresco: cobros.filter(c => normMedio(c.medio_pago) !== 'pack'),
           depack: cobros.filter(c => normMedio(c.medio_pago) === 'pack') };
}
function delta(now, before){
  if(!before) return '<span class="kd flat">— sin período anterior</span>';
  const d = (now - before) / before * 100;
  const cls = d > 1 ? 'up' : (d < -1 ? 'down' : 'flat');
  const flecha = d > 1 ? '▲' : (d < -1 ? '▼' : '≈');
  return '<span class="kd '+cls+'">'+flecha+' '+Math.abs(d).toFixed(1)+'% vs período anterior</span>';
}
function catDe(b, PRES){
  if(!b.prestacion_id || !PRES[b.prestacion_id]) return SIN_CAT;
  return PRES[b.prestacion_id].categoria || SIN_CAT;
}

function render(D){
  const { fresco, depack } = partes(D.cob);
  const prev = partes(D.cobPrev);
  const ingresos = sum(fresco, c=>c.monto);
  const skin = sum(fresco.filter(c=>c.empresa_id===1), c=>c.monto);
  const laser = sum(fresco.filter(c=>c.empresa_id===2), c=>c.monto);
  const comision = sum(fresco, c=>c.comision_real);
  const ventasPack = fresco.filter(c=>c.proveedor_ref==='pack_anticipo');
  const consumido = sum(depack, c=>c.monto);
  const emit = D.boletas.filter(b=>b.bsale_estado==='emitida');

  let h = '';

  // ── KPIs ──
  h += '<h2>'+D.R.etiqueta+' en una mirada</h2><div class="kpis">'
    + '<div class="kpi"><div class="kl">Ingresos (plata nueva)</div><div class="kv">'+clp(ingresos)+'</div>'+delta(ingresos, sum(prev.fresco,c=>c.monto))+'</div>'
    + '<div class="kpi"><div class="kl">SkinTouch</div><div class="kv">'+clp(skin)+'</div>'+delta(skin, sum(prev.fresco.filter(c=>c.empresa_id===1),c=>c.monto))+'</div>'
    + '<div class="kpi"><div class="kl">LaserTouch</div><div class="kv">'+clp(laser)+'</div>'+delta(laser, sum(prev.fresco.filter(c=>c.empresa_id===2),c=>c.monto))+'</div>'
    + '<div class="kpi"><div class="kl">Comisiones</div><div class="kv">'+clp(comision)+'</div><span class="kd flat">neto llegado: '+clp(ingresos-comision)+'</span></div>'
    + '<div class="kpi pack"><div class="kl">Packs vendidos</div><div class="kv">'+clp(sum(ventasPack,c=>c.monto))+'</div>'+delta(sum(ventasPack,c=>c.monto), sum(prev.fresco.filter(c=>c.proveedor_ref==='pack_anticipo'),c=>c.monto))+'</div>'
    + '<div class="kpi pack"><div class="kl">Efectivo Pack consumido</div><div class="kv">'+clp(consumido)+'</div><span class="kd flat">prepagado — no suma a ingresos</span></div>'
    + '<div class="kpi pack"><div class="kl">Deuda vigente a pacientes</div><div class="kv">'+clp(D.deudaHoy)+'</div><span class="kd flat">foto de hoy · '+D.packsActivos.length+' activo(s)</span></div>'
    + '</div>';

  const pacientes = new Set(D.cob.map(c=>c.paciente_rut).filter(r=>r && r!=='0-0'));
  h += '<div class="alerta ok">'+D.cob.length+' cobros de '+pacientes.size+' paciente(s) en '
    + new Set(D.cob.map(c=>diaScl(c.fecha))).size+' día(s) con movimiento.</div>';

  // ── Embudo por tipo de atención ──
  h += '<h2>Qué se atendió: el embudo</h2>';
  if(D.sinCategoria){
    h += '<div class="alerta warn">Para ver esta sección hay que correr <b>informe-categorias.sql</b> en Supabase (agrega la categoría a cada prestación del catálogo).</div>';
  } else {
    const { porCat, cats } = agruparPorCategoria(emit, D.PRES);
    const maxN = Math.max(1, ...cats.map(k=>porCat[k].n));
    h += '<div class="funnel">';
    cats.forEach((k,i) => {
      const x = porCat[k];
      h += '<div class="frow c'+(i%6+1)+'"><span class="fl">'+esc(k)+'</span>'
        + '<div class="fbar" style="width:'+Math.round(x.n/maxN*100)+'%"></div>'
        + '<span class="fm">'+x.n+' · '+clp(x.monto)+'</span></div>';
    });
    h += '</div>';

    // Conversión: consultas → quirúrgico. Mayor/menor sale de la marca del
    // Catálogo Maestro (cirugia_tipo); si aún no marcan nada, se muestra junto.
    const nCon = cats.filter(k=>/consulta/i.test(k)).reduce((s,k)=>s+porCat[k].n, 0);
    const nQuir = emit.filter(b=>/cirug|procedimiento/i.test(catDe(b, D.PRES))).length;
    let nMay = 0, nMen = 0;
    emit.forEach(b => {
      const p = D.PRES[b.prestacion_id];
      if(p && p.cirugia_tipo === 'mayor') nMay++;
      if(p && p.cirugia_tipo === 'menor') nMen++;
    });
    if(nCon > 0){
      const r = n => (n / nCon * 10).toFixed(1);
      const desglose = (nMay || nMen)
        ? ' — de esas, <b>'+r(nMen)+' menores</b> y <b>'+r(nMay)+' mayores</b> según el Catálogo Maestro'
        : '';
      h += '<div class="alerta ok">Conversión: por cada <b>10 consultas</b> hubo <b>'+r(nQuir)
        + ' cirugías o procedimientos</b>'+desglose+'. Esta es la aguja que mueven las campañas, cyberdays y redes.</div>';
    }
    if(porCat[SIN_CAT]){
      h += '<div class="alerta warn">'+porCat[SIN_CAT].n+' boleta(s) sin categoría (boletas consolidadas de abonos o prestaciones sin clasificar en el catálogo) — están en el Excel para revisarlas.</div>';
    }
  }

  // ── Por medio de pago ──
  h += '<h2>Por medio de pago</h2><table><thead><tr><th>Medio</th><th class="m">Cobros</th><th class="m">Bruto</th><th class="m">Comisión</th><th class="m">Neto</th></tr></thead><tbody>';
  MEDIOS.forEach(m => {
    const arr = fresco.filter(c=>normMedio(c.medio_pago)===m.key);
    if(!arr.length) return;
    const b = sum(arr,c=>c.monto), co = sum(arr,c=>c.comision_real);
    h += '<tr><td>'+m.label+'</td><td class="m">'+arr.length+'</td><td class="m">'+clp(b)+'</td><td class="m">'+clp(co)+'</td><td class="m">'+clp(b-co)+'</td></tr>';
  });
  h += '<tr class="tot"><td>Total plata nueva</td><td class="m">'+fresco.length+'</td><td class="m">'+clp(ingresos)+'</td><td class="m">'+clp(comision)+'</td><td class="m">'+clp(ingresos-comision)+'</td></tr>';
  h += '<tr><td>Efectivo Pack <span class="chip pack">no suma</span></td><td class="m">'+depack.length+'</td><td class="m">'+clp(consumido)+'</td><td class="m">—</td><td class="m">—</td></tr>';
  h += '</tbody></table>';

  // ── Evolución: día a día (mes) o mes a mes (períodos largos) ──
  const porUnidad = {};
  const unidad = D.R.n === 1 ? (c => diaScl(c.fecha)) : (c => diaScl(c.fecha).slice(0,7));
  D.cob.forEach(c => {
    const u = unidad(c);
    porUnidad[u] = porUnidad[u] || { skin:0, laser:0, pack:0 };
    if(normMedio(c.medio_pago)==='pack') porUnidad[u].pack += c.monto||0;
    else if(c.empresa_id===1) porUnidad[u].skin += c.monto||0;
    else if(c.empresa_id===2) porUnidad[u].laser += c.monto||0;
  });
  h += '<h2>'+(D.R.n===1?'Día a día':'Mes a mes')+'</h2><table><thead><tr><th>'+(D.R.n===1?'Día':'Mes')+'</th><th class="m">SkinTouch</th><th class="m">LaserTouch</th><th class="m">Plata nueva</th><th class="m">Efectivo Pack</th></tr></thead><tbody>';
  Object.keys(porUnidad).sort().forEach(u => {
    const x = porUnidad[u];
    h += '<tr><td>'+u+'</td><td class="m">'+clp(x.skin)+'</td><td class="m">'+clp(x.laser)+'</td><td class="m">'+clp(x.skin+x.laser)+'</td><td class="m">'+(x.pack?clp(x.pack):'—')+'</td></tr>';
  });
  h += '</tbody></table>';

  // ── Cuadratura Bsale ↔ caja ──
  const boleteado = sum(emit, b=>b.total);
  const idsConsumo = new Set(depack.map(c=>c.id));
  const consumoBoleteado = sum(emit.filter(b=>idsConsumo.has(b.cobro_id)), b=>b.total);
  const anticipos = sum(ventasPack, c=>c.monto);
  const conBoleta = new Set(emit.map(b=>b.cobro_id));
  const sinBoleta = fresco.filter(c => c.proveedor_ref !== 'pack_anticipo' && !conBoleta.has(c.id));
  const sinBoletaMonto = sum(sinBoleta, c=>c.monto);
  const reconstruido = boleteado - consumoBoleteado + anticipos + sinBoletaMonto;
  const cuadra = Math.abs(reconstruido - ingresos) < 1;
  h += '<h2>¿Cuadra Bsale con la caja?</h2>'
    + '<table><tbody>'
    + '<tr><td>Total boleteado en Bsale (emitidas del período)</td><td class="m">'+clp(boleteado)+'</td></tr>'
    + '<tr><td>− Boletas de consumo de pack (esa plata entró cuando se vendió el pack)</td><td class="m">−'+clp(consumoBoleteado)+'</td></tr>'
    + '<tr><td>+ Anticipos de packs vendidos (con recibo, sin boleta)</td><td class="m">+'+clp(anticipos)+'</td></tr>'
    + '<tr><td>+ Cobros aún sin boleta</td><td class="m">+'+clp(sinBoletaMonto)+'</td></tr>'
    + '<tr class="tot"><td>= Plata nueva reconstruida desde Bsale</td><td class="m">'+clp(reconstruido)+'</td></tr>'
    + '<tr class="tot"><td>Plata nueva según la caja</td><td class="m">'+clp(ingresos)+'</td></tr>'
    + '</tbody></table>';
  h += cuadra
    ? '<div class="alerta ok"><b>Cuadra al peso.</b> La diferencia entre lo boleteado y lo ingresado son exactamente los packs y abonos — tal como debe ser con el modelo de anticipos.</div>'
    : '<div class="alerta bad"><b>Descalce de '+clp(Math.abs(reconstruido-ingresos))+'.</b> Revisar: boletas anuladas sin reemitir, cobros anulados con boleta vigente, o emisiones con error.</div>';
  if(sinBoleta.length){
    h += '<div class="alerta warn"><b>'+sinBoleta.length+' cobro(s) sin boleta emitida</b>: '
      + sinBoleta.slice(0,6).map(c => diaScl(c.fecha)+' · '+EMP[c.empresa_id]+' · '+clp(c.monto)).join(' — ')
      + (sinBoleta.length>6 ? ' …y más en el Excel.' : '') + '</div>';
  }

  // ── Boletas por empresa ──
  h += '<h2>Boletas del período</h2><div class="dos">';
  [1,2].forEach(e => {
    const be = emit.filter(b=>b.empresa_id===e);
    h += '<table><thead><tr><th>'+EMP[e]+(e===1?' (exenta)':' (afecta IVA)')+'</th><th class="m"></th></tr></thead><tbody>'
      + '<tr><td>Boletas emitidas</td><td class="m">'+be.length+'</td></tr>'
      + '<tr><td>Total boleteado</td><td class="m">'+clp(sum(be,b=>b.total))+'</td></tr>'
      + '<tr><td>Neto</td><td class="m">'+clp(sum(be,b=>b.neto))+'</td></tr>'
      + '<tr><td>IVA</td><td class="m">'+clp(sum(be,b=>b.iva))+'</td></tr>'
      + '</tbody></table>';
  });
  h += '</div>';
  const anul = D.boletas.filter(b=>b.bsale_estado==='anulada');
  const err = D.boletas.filter(b=>b.bsale_estado==='error');
  if(anul.length) h += '<div class="alerta warn">'+anul.length+' boleta(s) anulada(s) con nota de crédito en el período.</div>';
  if(err.length) h += '<div class="alerta bad">'+err.length+' emisión(es) con error sin resolver — revisar y reemitir.</div>';

  // ── Conciliación ──
  const noConc = fresco.filter(c=>!c.conciliado);
  h += '<h2>Salud de la conciliación</h2>';
  h += noConc.length
    ? '<div class="alerta warn">'+noConc.length+' cobro(s) del período sin conciliar por '+clp(sum(noConc,c=>c.monto))+' — Andrea los ve en su caja, día por día.</div>'
    : '<div class="alerta ok">Período 100% conciliado: cada cobro fue confirmado contra el banco o Transbank.</div>';

  $('cont').innerHTML = h;
}

// ── Excel: resumen + detalles completos ──
function descargarExcel(){
  if(!DATA) return;
  const { fresco, depack } = partes(DATA.cob);
  const emit = DATA.boletas.filter(b=>b.bsale_estado==='emitida');
  const wb = XLSX.utils.book_new();

  const resumen = [
    ['Informe GP Dermatología', DATA.R.etiqueta],
    ['Generado desde el sistema de caja (cobros reales)'],
    [],
    ['Ingresos (plata nueva)', sum(fresco,c=>c.monto)],
    ['· SkinTouch (exento)', sum(fresco.filter(c=>c.empresa_id===1),c=>c.monto)],
    ['· LaserTouch (afecto IVA)', sum(fresco.filter(c=>c.empresa_id===2),c=>c.monto)],
    ['Comisiones registradas', sum(fresco,c=>c.comision_real)],
    ['Efectivo Pack consumido (prepagado, NO sumar)', sum(depack,c=>c.monto)],
    ['Ventas de packs incluidas en ingresos', sum(fresco.filter(c=>c.proveedor_ref==='pack_anticipo'),c=>c.monto)],
    ['Deuda vigente a pacientes (hoy)', DATA.deudaHoy],
    [],
    ['Medio de pago','Cobros','Bruto','Comisión','Neto']
  ];
  MEDIOS.forEach(m => {
    const arr = fresco.filter(c=>normMedio(c.medio_pago)===m.key);
    if(arr.length) resumen.push([m.label, arr.length, sum(arr,c=>c.monto), sum(arr,c=>c.comision_real), sum(arr,c=>c.monto)-sum(arr,c=>c.comision_real)]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumen), 'Resumen');

  if(!DATA.sinCategoria){
    const { porCat, cats } = agruparPorCategoria(emit, DATA.PRES);
    const cat = [['Categoría','Atenciones (boletas)','Monto boleteado']];
    cats.forEach(k => cat.push([k, porCat[k].n, porCat[k].monto]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cat), 'Por categoría');
  }

  const det = [['Día','Hora','Empresa','Paciente','RUT','Monto','Medio de pago','Tipo','Conciliado','Comisión']];
  DATA.cob.slice().sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(c => {
    det.push([ diaScl(c.fecha),
      new Date(c.fecha).toLocaleTimeString('es-CL',{timeZone:'America/Santiago',hour:'2-digit',minute:'2-digit'}),
      EMP[c.empresa_id]||c.empresa_id, DATA.NOM[c.paciente_rut]||'', c.paciente_rut||'',
      c.monto||0, c.medio_pago||'',
      c.proveedor_ref==='pack_anticipo'?'Venta pack (recibo)':(normMedio(c.medio_pago)==='pack'?'Consumo pack':'Atención'),
      c.conciliado?'Sí':'No', c.comision_real||0 ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(det), 'Detalle cobros');

  const bol = [['Empresa','Folio','Estado','Paciente RUT','Categoría','Neto','IVA','Total','Concepto','Reembolsable']];
  DATA.boletas.forEach(b => {
    const cat = DATA.sinCategoria ? '' : catDe(b, DATA.PRES);
    bol.push([EMP[b.empresa_id]||b.empresa_id, b.bsale_folio||'', b.bsale_estado||'', b.paciente_rut||'',
      cat, b.neto||0, b.iva||0, b.total||0, b.concepto||'', b.reembolsable?'Sí':'No']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(bol), 'Boletas');

  const pk = [['Pack activo','Tipo','Paciente RUT','Saldo (deuda)']];
  DATA.packsActivos.forEach(p => pk.push([p.nombre_pack||'Pack', p.tipo||'pack', p.paciente_rut||'', p.saldo||0]));
  pk.push(['TOTAL','','', DATA.deudaHoy]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pk), 'Deuda vigente');

  XLSX.writeFile(wb, 'informe-gp-' + DATA.R.etiqueta.replace(/\s+/g,'-').toLowerCase() + '.xlsx');
}
</script>
