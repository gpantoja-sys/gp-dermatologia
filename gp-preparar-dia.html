<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparar día · GP Dermatología</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --crema:#f4efe7; --crema2:#fbf8f2; --verde:#1f3d34; --tinta:#26201a;
    --suave:#8a8076; --linea:#e3dccf; --ok:#2f7d5b; --mal:#b23b3b; --aviso:#8a6d2f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--crema);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;
    line-height:1.5;padding:22px 16px 60px;display:flex;justify-content:center}
  .wrap{max-width:820px;width:100%}
  .head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
    padding:6px 0 14px;border-bottom:1px solid #E3E6E3;margin-bottom:18px}
  .head .t{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:20px;color:#1B2422}
  .head .s{font-size:12.5px;color:#7a8079;letter-spacing:.02em}
  .head img{height:80px;width:auto;display:block;justify-self:center}

  .barra{background:var(--crema2);border:1px solid var(--linea);border-radius:16px;
    padding:16px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .campo{display:flex;flex-direction:column;gap:4px}
  .campo label{font-size:11.5px;color:var(--suave);font-weight:500}
  .campo input{font-size:16px;padding:10px 12px;border:1px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta)}
  button.cargar{font-family:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:11px 18px;
    border:1px solid var(--verde);background:var(--verde);color:#fff;cursor:pointer}
  button.cargar:disabled{opacity:.5;cursor:progress}
  .resumen{font-size:13px;color:var(--suave);margin-left:auto}

  .cita{background:var(--crema2);border:1px solid var(--linea);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .cita .hora{font-family:ui-monospace,monospace;font-size:16px;font-weight:600;color:var(--verde);min-width:56px}
  .cita .quien{flex:1;min-width:200px}
  .cita .nom{font-weight:600;font-size:15.5px}
  .cita .meta{font-size:12.5px;color:var(--suave)}
  .cita .coment{font-size:12.5px;color:var(--verde);margin-top:3px;font-style:italic}
  .badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;white-space:nowrap}
  .badge.ok{background:#e8f0ec;color:#1f3d34;border:1px solid #bcd4c7}
  .badge.pend{background:#fbf3d9;color:#8a6d1f;border:1px solid #d9c58a}
  .badge.nuevo{background:#eef2f7;color:#2f5d8a;border:1px solid #b8cbe0}
  button.armar{font-family:inherit;font-size:13.5px;font-weight:600;border-radius:10px;padding:10px 15px;
    border:1px solid var(--verde);background:#fff;color:var(--verde);cursor:pointer;white-space:nowrap}
  button.armar:hover{background:var(--verde);color:#fff}
  button.armar:disabled{opacity:.45;cursor:not-allowed;border-color:var(--suave);color:var(--suave)}
  .vacio{text-align:center;color:var(--suave);font-size:14px;padding:40px 0;font-style:italic}
  .aviso{background:#fdf6e6;border:1px solid #e6d3a3;border-radius:12px;padding:11px 14px;
    font-size:13px;color:var(--aviso);margin-bottom:14px;display:none}
  .aviso.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div style="line-height:1.2;justify-self:start">
      <div class="t">Preparar día</div>
      <div class="s">Recepción · citas de Medilink → tótem</div>
    </div>
    <img src="/Logo-gp-Vertic.png" alt="Gonzalo Pantoja · Dermatología">
    <div></div>
  </div>

  <div class="barra">
    <div class="campo"><label>Fecha de la agenda</label>
      <input type="date" id="fecha"></div>
    <button class="cargar" id="btn" onclick="cargar()">Cargar citas</button>
    <div class="resumen" id="resumen"></div>
  </div>

  <div class="aviso" id="aviso"></div>
  <div id="lista"><div class="vacio">Elige una fecha y pulsa “Cargar citas”.</div></div>
</div>

<script>
const $ = id => document.getElementById(id);

// Fecha por defecto: mañana
(function(){
  const d = new Date(); d.setDate(d.getDate()+1);
  $('fecha').value = d.toISOString().slice(0,10);
})();

function esConfirmada(estado){
  return /confirm|sala de espera|atend|asis/i.test(estado||'');
}

async function cargar(){
  const fecha = $('fecha').value;
  if(!fecha){ return; }
  const btn = $('btn'); btn.disabled = true; btn.textContent = 'Cargando…';
  $('aviso').className = 'aviso';
  $('lista').innerHTML = '<div class="vacio">Consultando la agenda de Medilink…</div>';
  $('resumen').textContent = '';

  try {
    const r = await fetch('/api/medilink-citas?fecha=' + encodeURIComponent(fecha));
    const data = await r.json();
    if(!r.ok || !data.ok){ throw new Error(data.error || 'No se pudo cargar'); }
    render(data);
  } catch(e){
    $('lista').innerHTML = '<div class="vacio">No se pudieron cargar las citas. '
      + (e.message||'') + '</div>';
  } finally {
    btn.disabled = false; btn.textContent = 'Cargar citas';
  }
}

function render(data){
  const citas = data.citas || [];
  if(!citas.length){
    $('lista').innerHTML = '<div class="vacio">No hay citas tuyas para ese día.</div>';
    $('resumen').textContent = '';
    return;
  }
  const conf = citas.filter(c => esConfirmada(c.estado_cita)).length;
  const nuevos = citas.filter(c => !c.en_base).length;
  $('resumen').textContent = citas.length + ' citas · ' + conf + ' confirmadas';

  const av = $('aviso');
  if(nuevos > 0){
    av.className = 'aviso show';
    av.textContent = nuevos + ' paciente(s) recién agendada(s) todavía se están sincronizando. '
      + 'Aparecerán armables en unos minutos (o recarga esta página).';
  }

  $('lista').innerHTML = citas.map(function(c){
    const hora = (c.hora_inicio||'').slice(0,5);
    const conf = esConfirmada(c.estado_cita);
    const badge = conf
      ? '<span class="badge ok">'+c.estado_cita+'</span>'
      : '<span class="badge pend">'+(c.estado_cita||'Sin confirmar')+'</span>';
    const nuevoBadge = c.en_base ? '' : ' <span class="badge nuevo">Nuevo</span>';
    const coment = c.comentarios ? '<div class="coment">💬 '+c.comentarios+'</div>' : '';
    const boton = (c.en_base && c.rut)
      ? '<button class="armar" onclick="armar(\''+c.rut+'\')">Armar presupuesto</button>'
      : '<button class="armar" onclick="armarNueva('+c.id_paciente+', this)">Traer y armar</button>';
    return '<div class="cita">'
      + '<div class="hora">'+hora+'</div>'
      + '<div class="quien"><div class="nom">'+c.nombre_paciente+nuevoBadge+'</div>'
      + '<div class="meta">'+(c.nombre_atencion||'—')+(c.rut?(' · '+c.rut):'')+'</div>'
      + coment+'</div>'
      + badge
      + boton
      + '</div>';
  }).join('');
}

// Abre el generador ya pre-cargado con esa paciente (en pestaña nueva,
// así Clarita conserva la lista del día abierta).
function armar(rut){
  window.open('gp-presupuesto.html?rut=' + encodeURIComponent(rut), '_blank');
}

// Paciente "nueva": está en Medilink pero no en la base. La traemos, la creamos
// y recién ahí abrimos el generador. Abrimos la pestaña primero (para que el
// navegador no la bloquee) y la redirigimos cuando tenemos el RUT.
async function armarNueva(idPaciente, btn){
  const vent = window.open('', '_blank');
  if(vent) vent.document.write('<p style="font-family:sans-serif;padding:24px;color:#5C6153">Trayendo la paciente desde Medilink…</p>');
  if(btn){ btn.disabled = true; btn.textContent = 'Trayendo…'; }
  try {
    const r = await fetch('/api/medilink-paciente-sync?id=' + encodeURIComponent(idPaciente));
    const data = await r.json();
    if(!r.ok || !data.ok || !data.rut) throw new Error(data.error || 'No se pudo traer');
    if(vent) vent.location = 'gp-presupuesto.html?rut=' + encodeURIComponent(data.rut);
    else window.open('gp-presupuesto.html?rut=' + encodeURIComponent(data.rut), '_blank');
    if(btn){ btn.disabled = false; btn.textContent = 'Armar presupuesto'; }
  } catch(e){
    if(vent) vent.close();
    if(btn){ btn.disabled = false; btn.textContent = 'Traer y armar'; }
    alert('No se pudo traer la paciente desde Medilink. ' + (e.message||''));
  }
}
</script>
</body>
</html>
