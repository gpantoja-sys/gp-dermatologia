<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva y no-show · GP Dermatología</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --crema:#f4efe7; --crema2:#fbf8f2; --verde:#1f3d34; --verde2:#2c5446;
    --tinta:#26201a; --suave:#8a8076; --linea:#e3dccf;
    --ok:#2f7d5b; --mal:#b23b3b; --esp:#b8860b; --azul:#2c5446;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--crema);color:var(--tinta);
    font-family:'Inter',system-ui,sans-serif;line-height:1.5;padding:20px}
  .wrap{max-width:780px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
  h1{font-family:'Playfair Display',serif;font-weight:600;color:var(--verde);font-size:26px;margin:0}
  .sub{color:var(--suave);font-size:14px;margin:0 0 18px}
  .estado{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--suave);
    font-family:ui-monospace,monospace}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--suave)}
  .dot.ok{background:var(--ok)} .dot.mal{background:var(--mal)} .dot.esp{background:var(--esp)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .bar .sp{flex:1}
  .buscar{display:flex;gap:8px;width:100%}
  .buscar input{flex:1;font-family:ui-monospace,monospace;font-size:15px;padding:11px 13px;
    border:1px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta)}
  .buscar input:focus{outline:none;border-color:var(--verde2)}
  button{font-family:inherit;font-size:14px;font-weight:600;border-radius:10px;
    padding:9px 15px;border:1px solid var(--verde);background:var(--verde);color:#fff;cursor:pointer;transition:.15s}
  button:hover{background:var(--verde2)}
  button.ghost{background:transparent;color:var(--verde)}
  button.ghost:hover{background:rgba(31,61,52,.06)}
  button.mini{font-size:12.5px;padding:7px 11px;border-radius:9px}
  button.danger{border-color:var(--mal);color:var(--mal);background:transparent}
  button.danger:hover{background:rgba(178,59,59,.07)}
  button:disabled{opacity:.5;cursor:default}
  .card{background:var(--crema2);border:1px solid var(--linea);border-radius:16px;
    padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .chead{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    padding:3px 9px;border-radius:999px}
  .tag.apo{background:#eaf1ec;color:var(--verde)}
  .tag.pago{background:#f3ecdd;color:#7a5a13}
  .tag.otro{background:#eee;color:#555}
  .cname{font-family:'Playfair Display',serif;font-size:19px;color:var(--tinta);font-weight:600}
  .crut{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--suave);margin-left:auto}
  .cmeta{font-size:13.5px;color:var(--suave);margin:2px 0 14px}
  .sub-h,.hist-h{font-family:'Playfair Display',serif;font-size:15px;color:var(--verde);font-weight:600;margin:4px 0 10px}
  .hist-h{margin-top:18px}
  .campos{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
  .campo{flex:1;min-width:150px;display:flex;flex-direction:column;gap:4px}
  .campo label{font-size:12px;color:var(--suave);font-weight:500}
  .campo input,.campo select{font-family:inherit;font-size:14px;padding:9px 11px;
    border:1px solid var(--linea);border-radius:9px;background:#fff;color:var(--tinta)}
  .campo input:focus,.campo select:focus{outline:none;border-color:var(--verde2)}
  .check{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:var(--tinta);
    cursor:pointer;line-height:1.4;margin-top:4px}
  .check input{margin-top:2px;width:16px;height:16px;accent-color:var(--verde)}
  .desglose{border:1px solid var(--linea);border-radius:11px;overflow:hidden}
  .drow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;font-size:14px;
    border-bottom:1px solid var(--linea)}
  .drow:last-child{border-bottom:none}
  .drow .soc{font-weight:600}
  .drow .det{color:var(--suave);font-size:12px;margin-left:6px;font-weight:400}
  .acc{display:flex;gap:10px;flex-wrap:wrap}
  .acc button{flex:1;min-width:150px}
  .seccion-head{display:flex;align-items:center;gap:12px;margin:30px 0 14px}
  .seccion-head h2{font-family:'Playfair Display',serif;font-weight:600;color:var(--verde);font-size:20px;margin:0}
  .seccion-head .sp{flex:1}
  .vacio{text-align:center;color:var(--suave);padding:48px 20px;
    font-family:'Playfair Display',serif;font-size:19px}
  .vacio small{display:block;font-family:'Inter';font-size:13px;margin-top:6px}
  .aviso{font-size:12.5px;color:var(--esp);background:#fdf6e3;border:1px solid #ecd9a8;
    border-radius:9px;padding:8px 11px;margin-top:8px;display:none}
  .aviso.show{display:block}
  details.debug{margin-top:30px;border-top:1px solid var(--linea);padding-top:14px}
  details.debug summary{cursor:pointer;color:var(--suave);font-size:13px}
  .dbtns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  #log{font-family:ui-monospace,monospace;font-size:12px;background:#fffdf9;
    border:1px solid var(--linea);border-radius:10px;padding:11px;max-height:200px;overflow:auto;white-space:pre-wrap}
  .l-ok{color:var(--ok)} .l-mal{color:var(--mal)} .l-dim{color:var(--suave)}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:6px 0 14px;border-bottom:1px solid #E3E6E3;margin-bottom:18px">
    <div style="line-height:1.2;justify-self:start">
      <div style="font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:20px;color:#1B2422">Reserva y no-show</div>
      <div style="font-size:12.5px;color:#7a8079;letter-spacing:.02em">Recepción · Clarita</div>
    </div>
    <img src="/Logo-gp-Vertic.png" alt="Gonzalo Pantoja · Dermatología" style="height:80px;width:auto;display:block;justify-self:center" onerror="this.style.display='none'">
    <div class="estado" style="justify-self:end"><span class="dot" id="stDot"></span><span id="stTxt">conectando…</span></div>
  </div>

  <div class="bar">
    <div class="buscar">
      <input id="q" placeholder="RUT del paciente (ej. 14.543.741-5)" autocomplete="off">
      <button id="btn-buscar" onclick="buscar()">Buscar</button>
    </div>
  </div>
  <div class="aviso" id="rut-aviso"></div>

  <div id="resultado"></div>

  <div class="seccion-head">
    <h2>Requieren reserva</h2>
    <span class="sp"></span>
    <span class="estado"><span id="cont-lista">—</span></span>
    <button class="ghost mini" onclick="cargarListado()">Refrescar</button>
  </div>
  <div id="listado"></div>

  <div id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// RESERVA Y NO-SHOW · panel de recepción
//
// Reglas de la casa (acordadas con el Dr. Pantoja):
//  · Cuenta como falta: no llegar sin avisar, O cancelar con menos de 24 h.
//  · La reserva se descuenta de la atención si la paciente viene;
//    si vuelve a faltar, la reserva SE PIERDE (queda como ingreso).
//  · Una falta sin perdonar activa la exigencia de reserva.
//  · La exigencia se levanta A MANO. Al levantarla, las faltas quedan
//    perdonadas, para que la ficha no diga "3 faltas vigentes · sin restricción".
//  · Nada se borra: una falta se perdona, nunca se elimina.
//  · Monto de la reserva: el valor de la consulta (ver MONTO_RESERVA).
// ─────────────────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://nirxkzkfcctdigvuapuc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pcnhremtmY2N0ZGlndnVhcHVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDY5MTUsImV4cCI6MjA5NTEyMjkxNX0.iGTkHTRgdsEDoUsvS9ApQtSRAJV52z-_IASlFBmPqDM';
const OPERADOR = 'Clarita';
const MONTO_RESERVA = 95000;          // valor de la consulta
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const clp = n => '$' + Math.round(n||0).toLocaleString('es-CL');
// Escapa TODO lo que venga de la base o del teclado antes de pintarlo.
// Sin esto, una nota con "<sin respuesta>" desaparece de la ficha.
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function log(m, c){ const d=$('log'); const t=new Date().toLocaleTimeString('es-CL');
  const s=document.createElement('div'); if(c)s.className=c; s.textContent=`[${t}] ${m}`;
  d.appendChild(s); d.scrollTop=d.scrollHeight; }

let PAC = null;        // paciente buscado + sus faltas
let LISTA = [];        // filas de v_pacientes_requieren_reserva
let _ocupado = false;  // candado anti doble-clic (una acción a la vez)

// ── RUT ──────────────────────────────────────────────────────────────────────
function normRut(s){
  if(!s) return '';
  let t = (''+s).replace(/[^0-9kK]/g,'').toUpperCase();
  if(t.length < 2) return '';
  return t.slice(0,-1) + '-' + t.slice(-1);
}
// Dígito verificador: evita marcar a OTRA persona por un tipeo.
function dvValido(rut){
  const p = rut.split('-'); if(p.length !== 2) return false;
  let num = parseInt(p[0],10); if(!num) return false;
  let s = 1, m = 0;
  for(; num > 0; num = Math.floor(num/10)) s = (s + (num % 10) * (9 - m++ % 6)) % 11;
  return (s ? String(s-1) : 'K') === p[1].toUpperCase();
}

// ── Fechas ───────────────────────────────────────────────────────────────────
// Tolera que `fecha_hora` sea date ('2026-08-03') o timestamptz (ISO completo):
// antes, con timestamptz el historial mostraba "Invalid Date".
function fechaDia(d){
  if(!d) return 'sin fecha';
  const dt = new Date(String(d).slice(0,10) + 'T00:00:00');
  return isNaN(dt) ? 'sin fecha' : dt.toLocaleDateString('es-CL');
}
function fechaCorta(iso){
  if(!iso) return '—';
  const dt = new Date(iso);
  return isNaN(dt) ? '—' : dt.toLocaleDateString('es-CL');
}
function hoyScl(){ return new Date().toLocaleDateString('en-CA',{timeZone:'America/Santiago'}); }
function nombreDe(o){ return [o.nombre,o.apellido].filter(Boolean).join(' ').trim() || o.rut; }

// ── Buscar paciente ──────────────────────────────────────────────────────────
async function buscar(){
  const crudo = $('q').value;
  const rut = normRut(crudo);
  const av = $('rut-aviso'); av.className = 'aviso';
  if(!rut){ $('resultado').innerHTML=''; return; }
  $('q').value = rut;
  if(!dvValido(rut)){
    av.textContent = '⚠ El dígito verificador de ' + rut + ' no calza. Revisa el RUT antes de marcar a alguien por error.';
    av.className = 'aviso show';
  }
  const { data, error } = await sb.from('pacientes')
    .select('rut,nombre,apellido,tel,requiere_reserva,requiere_reserva_actualizado_en,requiere_reserva_por')
    .eq('rut', rut).maybeSingle();
  if(error){ log('buscar → '+error.message,'l-mal'); return; }
  if(!data){
    PAC = null;
    $('resultado').innerHTML = `<div class="card"><div class="cmeta" style="margin:0">No encontré el RUT <b>${esc(rut)}</b> en la base de pacientes.</div></div>`;
    return;
  }
  const { data:faltas, error:ef } = await sb.from('inasistencias')
    .select('*').eq('paciente_rut', rut).order('created_at',{ascending:false});
  if(ef){ log('faltas → '+ef.message,'l-mal'); }
  PAC = data; PAC.faltas = faltas || [];
  renderPaciente();
}

function historial(faltas){
  if(!faltas || !faltas.length) return '';
  const rows = faltas.map(f=>{
    const mot = f.motivo==='aviso_tardio' ? 'Canceló &lt;24 h' : 'No llegó';
    const est = f.perdonada
      ? ('perdonada' + (f.perdonada_por ? ' por '+esc(f.perdonada_por) : ''))
      : 'cuenta';
    return `<div class="drow">
      <span><span class="soc">${mot}</span><span class="det">${est} · hora ${esc(fechaDia(f.fecha_hora))}${f.nota?(' · '+esc(f.nota)):''}</span></span>
      <span class="det">${esc(fechaCorta(f.created_at))}</span></div>`;
  }).join('');
  return `<div class="hist-h">Historial de faltas</div><div class="desglose">${rows}</div>`;
}

function renderPaciente(){
  const cont = $('resultado');
  if(!PAC){ cont.innerHTML=''; return; }
  const p = PAC;
  const activo = !!p.requiere_reserva;
  const vigentes = (p.faltas||[]).filter(f=>!f.perdonada).length;
  const total = (p.faltas||[]).length;
  const desde = activo && p.requiere_reserva_actualizado_en
    ? ' · desde ' + esc(fechaCorta(p.requiere_reserva_actualizado_en))
      + (p.requiere_reserva_por ? ' por '+esc(p.requiere_reserva_por) : '')
    : '';
  cont.innerHTML = `<div class="card">
    <div class="chead">
      <span class="tag ${activo?'pago':'otro'}">${activo?'Requiere reserva':'Sin restricción'}</span>
      <span class="cname">${esc(nombreDe(p))}</span>
      <span class="crut">${esc(p.rut)}</span>
    </div>
    <div class="cmeta">${p.tel?('Tel '+esc(p.tel)+' · '):''}${vigentes} falta(s) vigente(s) · ${total} en total${desde}</div>
    ${activo?`<div class="cmeta" style="color:var(--esp);margin-top:-8px">Al agendar se le pide reserva de <b>${clp(MONTO_RESERVA)}</b>: se descuenta de su atención si viene, y <b>se pierde</b> si vuelve a faltar.</div>`:''}
    <div class="acc" style="margin-bottom:18px">
      ${activo
        ? `<button class="danger" id="btn-flag" onclick="setReserva('${esc(p.rut)}',false)">Quitar reserva</button>`
        : `<button id="btn-flag" onclick="setReserva('${esc(p.rut)}',true)">Exigir reserva</button>`}
    </div>

    <div class="sub-h">Registrar inasistencia</div>
    <div class="campos">
      <div class="campo"><label>Motivo</label>
        <select id="f-motivo">
          <option value="no_llego">No llegó</option>
          <option value="aviso_tardio">Canceló con menos de 24 h</option>
        </select></div>
      <div class="campo" style="max-width:180px"><label>Fecha de la hora perdida</label>
        <input type="date" id="f-fecha" value="${hoyScl()}" max="${hoyScl()}"></div>
    </div>
    <div class="campo" style="margin-bottom:6px"><label>Nota interna (opcional)</label>
      <input id="f-nota" placeholder="Detalle para la ficha" maxlength="200"></div>
    <label class="check"><input type="checkbox" id="f-perdonar">
      Perdonar esta falta — la registro pero <b>no</b> activo la reserva (paciente fiel, Caso C)</label>
    <div class="acc" style="margin-top:16px">
      <button id="btn-registrar" onclick="registrar('${esc(p.rut)}')">Registrar inasistencia</button>
    </div>
    ${historial(p.faltas)}
  </div>`;
}

// ── Encender / apagar la exigencia de reserva ────────────────────────────────
async function setReserva(rut, valor){
  if(_ocupado) return;
  _ocupado = true;                     // ← candado ANTES de preguntar: dos clics
  const btn = $('btn-flag');           //   rápidos no alcanzan a colarse
  if(btn) btn.disabled = true;
  try{
    const p = (PAC && PAC.rut===rut) ? PAC : (LISTA.find(x=>x.rut===rut) || {rut});
    const quien = nombreDe(p);
    const msg = valor
      ? `¿Exigir reserva a ${quien}?\n\nAl agendar se le pedirá ${clp(MONTO_RESERVA)} por adelantado.`
      : `¿Quitar la exigencia de reserva a ${quien}?\n\nSus faltas quedarán perdonadas y podrá agendar libremente.`;
    if(!confirm(msg)){ if(btn) btn.disabled = false; return; }
    const { error } = await sb.from('pacientes').update({
      requiere_reserva: valor,
      requiere_reserva_actualizado_en: new Date().toISOString(),
      requiere_reserva_por: OPERADOR
    }).eq('rut', rut);
    if(error) throw error;

    // Al LEVANTAR la reserva, las faltas dejan de contar. Si no, la ficha
    // seguiría diciendo "3 faltas vigentes" con la restricción ya quitada.
    let perdonadas = 0;
    if(!valor){
      const { data:pd, error:ep } = await sb.from('inasistencias')
        .update({ perdonada:true, perdonada_en:new Date().toISOString(), perdonada_por:OPERADOR })
        .eq('paciente_rut', rut).eq('perdonada', false).select('id');
      if(ep) log('perdonar faltas → '+ep.message,'l-mal');
      else perdonadas = (pd||[]).length;
    }
    log(`Reserva ${valor?'activada':'quitada'} · ${rut}`
      + (perdonadas?` · ${perdonadas} falta(s) perdonada(s)`:''), 'l-ok');
    if(PAC && PAC.rut===rut) await buscar(); else await cargarListado();
    if(PAC && PAC.rut===rut) cargarListado();
  }catch(e){
    log('reserva → '+(e.message||e),'l-mal'); alert('Error: '+(e.message||e));
    if(btn) btn.disabled = false;
  }finally{ _ocupado = false; }
}

// ── Registrar inasistencia ───────────────────────────────────────────────────
async function registrar(rut){
  if(_ocupado) return;
  _ocupado = true;                     // ← candado ANTES de validar y preguntar:
  const btn = $('btn-registrar');      //   sin esto, dos clics crean dos faltas
  const soltar = () => { if(btn){ btn.disabled = false; btn.textContent = 'Registrar inasistencia'; } };
  if(btn){ btn.disabled = true; btn.textContent = 'Registrando…'; }
  try{
    const motivo   = $('f-motivo').value;
    const fecha    = $('f-fecha').value || null;
    const nota     = ($('f-nota').value||'').trim() || null;
    const perdonar = $('f-perdonar').checked;

    if(!fecha){ alert('Indica la fecha de la hora perdida: es el respaldo de la falta.'); soltar(); return; }
    const nom = (PAC && PAC.rut===rut) ? nombreDe(PAC) : rut;
    const txtMot = motivo==='aviso_tardio' ? 'canceló con menos de 24 h' : 'no llegó';
    const yaActivo = !!(PAC && PAC.requiere_reserva);
    const efecto = perdonar
      ? 'Queda registrada como PERDONADA' + (yaActivo ? ' (la reserva ya activa se mantiene).' : ', sin activar la reserva.')
      : (yaActivo ? 'Se mantiene la exigencia de reserva.' : 'Esto ACTIVARÁ la exigencia de reserva.');
    if(!confirm(`Registrar falta de ${nom}\nHora del ${fechaDia(fecha)} · ${txtMot}\n\n${efecto}`)){ soltar(); return; }

    const fila = { paciente_rut: rut, fecha_hora: fecha, motivo, nota,
                   perdonada: perdonar, marcado_por: OPERADOR };
    if(perdonar){ fila.perdonada_en = new Date().toISOString(); fila.perdonada_por = OPERADOR; }
    const { error } = await sb.from('inasistencias').insert(fila);
    if(error) throw error;

    if(!perdonar){
      const { error:eu } = await sb.from('pacientes').update({
        requiere_reserva: true,
        requiere_reserva_actualizado_en: new Date().toISOString(),
        requiere_reserva_por: OPERADOR
      }).eq('rut', rut);
      if(eu) log('activar flag → '+eu.message,'l-mal');
    }
    log(`Inasistencia registrada · ${rut}${perdonar?' · perdonada':' · reserva activada'}`, 'l-ok');
    await buscar();
    cargarListado();
  }catch(e){
    log('inasistencia → '+(e.message||e),'l-mal'); alert('Error: '+(e.message||e));
    soltar();
  }finally{ _ocupado = false; }
}

// ── Listado: pacientes que requieren reserva ─────────────────────────────────
async function cargarListado(){
  const { data, error } = await sb.from('v_pacientes_requieren_reserva').select('*').limit(300);
  if(error){ log('listado → '+error.message,'l-mal'); $('stDot').className='dot mal'; $('stTxt').textContent='error'; return; }
  $('stDot').className='dot ok'; $('stTxt').textContent='conectado';
  LISTA = data || [];
  $('cont-lista').textContent = LISTA.length + (LISTA.length===1?' paciente':' pacientes');
  const cont = $('listado'); cont.innerHTML='';
  if(!LISTA.length){
    cont.innerHTML = '<div class="vacio">Nadie requiere reserva<small>Todos pueden agendar libremente</small></div>';
    return;
  }
  LISTA.forEach(r=>{
    cont.insertAdjacentHTML('beforeend', `<div class="card">
      <div class="chead"><span class="tag pago">Requiere reserva</span>
        <span class="cname">${esc(nombreDe(r))}</span><span class="crut">${esc(r.rut)}</span></div>
      <div class="cmeta">${r.faltas_vigentes||0} falta(s) vigente(s) · última ${esc(fechaCorta(r.ultima_falta))}${r.tel?(' · Tel '+esc(r.tel)):''}</div>
      <div class="acc">
        <button class="ghost mini" onclick="verPaciente('${esc(r.rut)}')">Ver ficha</button>
        <button class="danger mini" onclick="setReserva('${esc(r.rut)}',false)">Quitar reserva</button>
      </div></div>`);
  });
}
function verPaciente(rut){ $('q').value=rut; buscar(); window.scrollTo({top:0,behavior:'smooth'}); }
